<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bombay Calling</title>
  <style>
    :root{
      --pad: clamp(12px, 4vw, 56px);
      --bg: #f3e4d6; 
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    .screen {
      width: 100%;
      min-height: 100dvh;         
      display: grid;
      place-items: center;         
      padding: var(--pad);
      box-sizing: border-box;
      overflow: hidden;
      background: var(--bg);
    }

    .screen img {
      max-width: 100%;
      max-height: calc(100dvh - (2 * var(--pad)));
      width: auto;
      height: auto;
      display: block;

      opacity: 0;
      transform: translateY(10px) scale(0.99);
      animation: intro 900ms ease-out forwards;
    }

    @keyframes intro {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen img { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <img src="bbycalling.jpg" alt="Bombay Calling" />
  </div>
</body>
</html>
